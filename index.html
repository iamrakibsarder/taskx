<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0b14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="TaskX: time tracking, review and client invoicing." />
    <title>TaskX</title>
    <script>
      // Apply the saved theme before first paint, so dark mode doesn't flash white.
      try {
        var t = JSON.parse(localStorage.getItem('taskx.theme'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
